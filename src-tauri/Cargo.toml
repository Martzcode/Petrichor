[package]
name = "petrichor"
description = "Application de bureau Petrichor (coquille Tauri)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "petrichor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
dev-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
petrichor-core.workspace = true
petrichor-sys.workspace = true
petrichor-compat.workspace = true
