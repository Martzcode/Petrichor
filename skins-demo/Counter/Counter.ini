[Metadata]
Name=Compteur
Author=Petrichor
Information=Compteur animé, démonstration des mesures Calc et Loop.
Version=1.0

[Variables]
Accent=2F9E6B
TextColor=E6EDF3
Pulse=off

[Petrichor]
OnRefreshAction=[!Draggable "1"]
Update=250
DynamicWindowSize=1
SolidColor=101418CC
Padding=10,10,10,10

[MeasureCount]
Measure=Calc

[MeasureCycle]
Measure=Loop
Start=0
End=9
Step=1
MinValue=0
MaxValue=9

[StyleBase]
FontFace=DejaVu Sans
StringAlign=Center
FontColor=#TextColor#

[MeterCount]
Meter=String
MeasureName=MeasureCount
MeterStyle=StyleBase
FontSize=34
Text=Tours : %1% (#Pulse#)
LeftMouseUpAction=[!Log "Compteur cliqué"]

[MeterCycle]
Meter=String
MeasureName=MeasureCycle
MeterStyle=StyleBase
FontSize=18
Text=Cycle : %1%
X=0r
Y=6R
MouseOverAction=[!Log "Survol du cycle"]
