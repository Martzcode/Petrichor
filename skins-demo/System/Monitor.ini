[Metadata]
Name=Moniteur
Author=Petrichor
Information=Surveillance CPU et mémoire, démonstration des mesures et du style partagé.
Version=1.0

@Include=Includes/Styles.inc

[Petrichor]
Update=1000
DynamicWindowSize=1
SolidColor=#BackColor#CC

[MeasureCPU]
Measure=CPU
UpdateDivider=1

[MeasureRAM]
Measure=Memory
UpdateDivider=2

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=12
Y=20
W=200
H=12
BarColor=#BarColor#
SolidColor=30, 36, 42, 200

[MeterCPUText]
Meter=String
MeasureName=MeasureCPU
MeterStyle=StyleLabel
X=12
Y=4
Text=CPU : %1%

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=12r
Y=28
W=200
H=12
BarColor=#BarColor#
SolidColor=30, 36, 42, 200

[MeterRAMText]
Meter=String
MeasureName=MeasureRAM
MeterStyle=StyleLabel
X=12r
Y=90
Text=Mémoire : %1%
