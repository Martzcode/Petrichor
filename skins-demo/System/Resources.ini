[Metadata]
Name=Ressources
Author=Petrichor
Information=Réseau, disque et informations système (Phase 6).
Version=1.0

[Variables]
BackColor=101418
TextColor=FFFFFFFF
Accent=38BDF8

[Petrichor]
OnRefreshAction=[!Draggable "1"]
Update=2000
DynamicWindowSize=1
SolidColor=#BackColor#CC
Padding=12,12,12,12

[MeasureDisk]
Measure=FreeDiskSpace
Drive=/
Total=0

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=/
Total=1

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

[MeasureHost]
Measure=SysInfo
SysInfoType=COMPUTER_NAME

[MeasureWifi]
Measure=WifiStatus
WifiInfoType=SSID

[MeterTitle]
Meter=String
Text=Ressources système
FontFace=sans-serif
FontSize=12
FontColor=#Accent#FF
StringStyle=Bold

[MeterDisk]
Meter=String
MeasureName=MeasureDisk
MeasureName2=MeasureDiskTotal
X=0
Y=6R
FontFace=sans-serif
FontSize=10
FontColor=#TextColor#
Text=Disque : %1 / %2 octets libres

[MeterNetIn]
Meter=String
MeasureName=MeasureNetIn
X=0
Y=4R
FontFace=sans-serif
FontSize=10
FontColor=#TextColor#
Text=Entrée : %1 o/s

[MeterNetOut]
Meter=String
MeasureName=MeasureNetOut
X=0
Y=4R
FontFace=sans-serif
FontSize=10
FontColor=#TextColor#
Text=Sortie : %1 o/s

[MeterHost]
Meter=String
MeasureName=MeasureHost
MeasureName2=MeasureWifi
X=0
Y=4R
FontFace=sans-serif
FontSize=10
FontColor=#TextColor#
Text=%1 — Wi-Fi : %2
