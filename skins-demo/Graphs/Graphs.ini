[Metadata]
Name=Graphs
Author=Petrichor
Information=Démonstration Histogram et Line

[Variables]
BackColor=101418
Accent=38BDF8
Accent2=F472B6

[Petrichor]
OnRefreshAction=[!Draggable "1"]
Update=250
DynamicWindowSize=1
SolidColor=#BackColor#CC
Padding=10,10,10,10

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=Memory

[MeterTitle]
Meter=String
Text=CPU 42% / RAM 61%
FontFace=sans-serif
FontSize=11
FontColor=FFFFFFFF
StringStyle=Bold
InlineSetting=COLOR #Accent#
InlinePattern=CPU
InlineSetting2=SIZE 15
InlinePattern2=\d+%
ToolTipText=Histogramme CPU et mémoire
ToolTipTitle=Graphs
ToolTipIcon=INFO
ToolTipWidth=220

[MeterHistogram]
Meter=Histogram
MeasureName=MeasureCPU
SecondaryMeasureName=MeasureRAM
PrimaryColor=#Accent#FF
SecondaryColor=#Accent2#FF
BothColor=A78BFAFF
W=180
H=60
Y=6R

[MeterLine]
Meter=Line
LineCount=2
MeasureName=MeasureCPU
MeasureName2=MeasureRAM
LineColor=#Accent#FF
LineColor2=#Accent2#FF
LineWidth=2
HorizontalLines=2
HorizontalColor=FFFFFF22
W=180
H=60
Y=8R
