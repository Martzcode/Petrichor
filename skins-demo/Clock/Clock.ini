[Metadata]
Name=Horloge
Author=Petrichor
Information=Horloge simple, démonstration du langage de skinning.
Version=1.0

[Variables]
Accent=2F9E6B
TextColor=E6EDF3

[Petrichor]
OnRefreshAction=[!Draggable "1"]
Update=1000
DynamicWindowSize=1
SolidColor=101418CC
Padding=8,8,8,8

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A %d %B

[StyleBase]
FontFace=DejaVu Sans
StringAlign=Center
AntiAlias=1
FontColor=#TextColor#

[MeterTime]
Meter=String
MeasureName=MeasureTime
MeterStyle=StyleBase
FontSize=48
StringAlign=Center
X=0
Y=0
LeftMouseUpAction=[!Log "Horloge cliquée"]

[MeterDate]
Meter=String
MeasureName=MeasureDate
MeterStyle=StyleBase
FontSize=14
X=0r
Y=8R
